# Fork cawicher/haip only (never sent upstream): builds the API image (API +
# dashboard + booking SPAs) and publishes it to GHCR, so the CPIDM host only
# pulls by digest — the Node/pnpm/Vite build does not fit on that host.
name: Imagem (CPIDM)

on:
  push:
    tags: ['cpidm-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/haip-api
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest
        run: |
          echo "### ghcr.io/${{ github.repository_owner }}/haip-api@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}"
